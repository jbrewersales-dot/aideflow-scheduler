name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        # Turning Pages on from a workflow needs a repository setting that only
        # an owner can change, so explain that rather than failing cryptically.
        continue-on-error: true
      - name: Check that GitHub Pages is switched on
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not switched on::Open the repository on github.com, go to Settings then Pages, and under 'Build and deployment' set Source to 'GitHub Actions'. Then re-run this workflow. The desktop installers are unaffected."
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

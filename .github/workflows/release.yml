name: Build desktop installers

# Builds the AideFlow desktop app for Windows, Mac and Linux and attaches the
# installers to a GitHub Release so anyone can download them.
#
# Runs automatically when a tag like v1.0.0 is pushed, or start it by hand from
# the Actions tab ("Run workflow"). It also builds (without publishing a
# Release) on every pull request, so the installers can be downloaded from the
# workflow run's "Artifacts" section.

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac --x64 --arm64
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AideFlow ${{ github.event.inputs.tag || github.ref_name }}
          files: installers/*
          body: |
            Download the file for your computer, then open it:

            - **Windows:** `AideFlow-Setup-*.exe` (installer) or `AideFlow-Portable-*.exe` (no install needed). If Windows shows "protected your PC", click **More info → Run anyway**.
            - **Mac:** `AideFlow-*-mac-arm64.dmg` for newer Macs (Apple chip) or `AideFlow-*-mac-x64.dmg` for older Intel Macs. Drag AideFlow into Applications. First time only: right-click the app → **Open**.
            - **Linux:** `AideFlow-*-linux.AppImage`. Make it executable and double-click.
